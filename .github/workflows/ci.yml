name: CI

# Two legs, and the macOS one is not about shipping macOS. It is what
# mechanically enforces that Core stays free of Windows-only dependencies:
# if it goes red because someone reached for a Windows API, that is the leg
# doing its job. See docs/TESTING.md.
on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled: the metrics job honours the tests-removed and
    # coverage-drop labels, so changing a label has to re-run it.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one leg's failure must not hide the other's result
      matrix:
        include:
          - os: windows-latest
            name: windows-latest (ship target)
          - os: macos-latest
            name: macos-latest (portability guard)

    steps:
      - uses: actions/checkout@v4

      # global.json pins 10.0.201 with rollForward latestFeature, so this
      # installs that or a higher feature band of the same major.minor. The
      # pin is the LOWER of the two dev machines' SDKs on purpose:
      # latestFeature rolls a band up and never down.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore LoreFetch.slnx

      - name: Build
        run: dotnet build LoreFetch.slnx -c Release --no-restore

      # ---------------------------------------------------------------------
      # Tests go through scripts/lorefetch.sh, NOT through `dotnet test`.
      #
      # This is deliberate and it is load-bearing. Measured on this repo
      # 2026-09-21: `dotnet test` EXITS 0 WHILE RUNNING ZERO TESTS, in two
      # distinct ways —
      #
      #   "No test is available"                      no adapter registered
      #   "No test matches the given testcase filter" filter excluded all
      #
      # A leg calling `dotnet test` directly is therefore green when it has
      # tested nothing at all, which is precisely the failure the five-level
      # test strategy exists to prevent. The script traps both and exits 1.
      # A guard that only exists on a developer's machine does not guard the
      # thing that gates merges.
      #
      # It also owns the per-platform category filter, derived from `uname`:
      # both legs drop Category=Hardware, and the macOS leg additionally
      # drops Category=WindowsOnly, because the golden hashes are generated
      # on win-x64 and INTER_AREA is not bit-exact on ARM64 (CLAUDE.md
      # Risk 2, measured in S0.0: this OpenCV build reports
      # "Custom HAL: YES (carotene ...)"). Keeping that in one place means a
      # local run and a CI run cannot disagree — and a local run that
      # disagrees with CI is worse than no local run.
      #
      # `shell: bash` works on windows-latest, which ships Git Bash — the
      # same interpreter hooks/pre-commit already requires.
      # ---------------------------------------------------------------------
      # The Windows leg also writes TRX results and coverage, which the
      # metrics job below compares with main. One leg is enough, and it must
      # be the same leg every time, so the numbers are comparable.
      - name: Test
        shell: bash
        run: bash scripts/lorefetch.sh test --no-pull ${{ runner.os == 'Windows' && '--results artifacts/test-results' || '' }}

      - name: Collect metrics
        if: runner.os == 'Windows'
        shell: bash
        run: dotnet run scripts/Metrics.cs -- collect artifacts/test-results artifacts/metrics.json

      - name: Upload metrics
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: artifacts/metrics.json
          retention-days: 90

      # Not run here, deliberately:
      #   Accuracy  — a measurement committed as a table, not a pass/fail gate,
      #               and it needs the fixture corpus, which is card imagery and
      #               can never be committed.
      #   Hardware  — needs the C920. Filtered out on both legs.
      #   Real       — the end-to-end suite's real-implementation cases skip
      #               here with a stated reason, because they need the hash
      #               index and the Scryfall cache. That is why "integration is
      #               done" is defined as zero skips under
      #               LOREFETCH_REQUIRE_REAL=1 on the local win-x64 machine,
      #               NOT as zero skips in CI, which is unreachable by
      #               construction. See docs/TESTING.md and finding V7.

  # Formatting per .editorconfig: `dotnet format --verify-no-changes`, via the
  # same entry point as a local `scripts/lorefetch.sh lint`. One Linux leg is
  # enough; .gitattributes pins LF, so the result does not depend on the OS.
  # To fix a failure locally: scripts/lorefetch.sh lint --fix.
  #
  # PRs only, like `guards` below. main's ruleset requires both on a branch
  # that is up to date with main and merges by squash, so a push to main
  # carries exactly the tree its PR already passed; re-checking it would only
  # catch a newer SDK formatting differently, which the next PR catches anyway.
  # build-and-test is different: its push-to-main run is metrics' baseline.
  lint:
    name: lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Lint
        run: bash scripts/lorefetch.sh lint

  # The card-imagery and CardSpotter-attribution checks, by running the
  # pre-commit hook itself. A contributor can leave the hook unwired or skip it
  # with --no-verify, so as a local check it only helps; as a required check it
  # holds. One file, so the hook and CI cannot disagree.
  guards:
    name: guards
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Imagery and attribution
        run: sh hooks/pre-commit

  # The test-count and coverage ratchet (scripts/Metrics.cs). Compares this
  # PR's metrics with the latest successful push to main. Fails on fewer
  # tests, fewer tests that ran, or lost coverage in a shipped assembly,
  # unless the PR carries the tests-removed or coverage-drop label. With no
  # baseline yet (or one past the 90-day artifact retention) it passes and
  # says so.
  metrics:
    name: metrics
    needs: build-and-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download this run's metrics
        uses: actions/download-artifact@v4
        with:
          name: metrics
          path: current

      - name: Download main's metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push                      --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run_id" ] && gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name metrics --dir baseline; then
            echo "Baseline: main run $run_id"
          else
            echo "No baseline metrics from main yet."
          fi

      - name: Compare
        env:
          ALLOW_TESTS_REMOVED: ${{ contains(github.event.pull_request.labels.*.name, 'tests-removed') }}
          ALLOW_COVERAGE_DROP: ${{ contains(github.event.pull_request.labels.*.name, 'coverage-drop') }}
        run: |
          set -- compare baseline/metrics.json current/metrics.json --summary "$GITHUB_STEP_SUMMARY"
          [ "$ALLOW_TESTS_REMOVED" = true ] && set -- "$@" --allow-tests-removed
          [ "$ALLOW_COVERAGE_DROP" = true ] && set -- "$@" --allow-coverage-drop
          dotnet run scripts/Metrics.cs -- "$@"
